# call-analyzer ayar dosyasi ornegi
# Kullanim:  java -jar call-analyzer-1.0.0-SNAPSHOT-all.jar --config ornek-ayar.properties --entry "com.example.RentalService#rent"
# Her satir 'secenek=deger' (basta -- olmadan). Komut satirindaki secenekler bu dosyadakilere eklenir.
# Windows yollari oldugu gibi yazilabilir (ters bolu kacis karakteri degildir).

# Analiz edilecek kod: birden fazla girdi virgulle ya da isletim sisteminin yol ayiriciyla (Windows: ; Linux: :)
cp=uygulamam.jar
#cp=acik\BOOT-INF\classes,acik\BOOT-INF\lib\*

target=com.example.ICar
include=com.example

# Acquire karsilastirmasi
acquirer=com.example.CarAcquirer#acquire
acquire-annotation=com.example.AcquireCar

# Event takibi
event-class=com.example.event.Event
event-dispatcher=com.example.event.EventDispatcher
event-observer=com.example.event.IObserver
event-handle-method=handle
# new: akista new'lenen her event yayinlanmis sayilir (varsayilan); dispatch: yalnizca notify(event) ile verilenler
event-detection=new
# addObserver(this) ile kaydolan IObserver<AEvent>: exact = yalnizca AEvent, assignable = alt siniflari da
event-match=exact

# Cikti: text, json ya da html (html icin -o rapor.html verin; open=true raporu tarayicida acar)
#format=html
#output=rapor.html
#open=true

# Toplu tarama: acquire eden tum metotlari analiz et (entry yerine)
#scan=true

# Bayraklar
tree=false
fail-on-missing=false
