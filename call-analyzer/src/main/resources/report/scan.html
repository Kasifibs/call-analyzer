<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acquire Taraması</title>
<style>/*CSS*/</style>
</head>
<body>
<header>
  <h1>Acquire Taraması</h1>
  <div class="sub" id="sub"></div>
</header>
<main id="main"></main>
<script id="data" type="application/json">/*DATA*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : String(kid));
  return e;
}
const badge = (text, cls) => h("span", {class: "badge " + (cls || "")}, text);
const STATUS = {MISSING: ["Eksik var", "hit"], POSSIBLE: ["Olası eksik", "warn"], OK: ["OK", "ok"], ERROR: ["Hata", "hit"]};

document.getElementById("sub").append([D.acquirer, D.annotation ? "@" + D.annotation : null].filter(Boolean).join(", "),
    "  ·  ", D.generated);
const main = document.getElementById("main");
const count = s => D.methods.filter(m => m.status === s).length;
main.append(h("div", {class: "cards"},
    card(D.methods.length, "Taranan metot"),
    card(count("MISSING"), "Kesin eksiği olan", count("MISSING") ? "bad" : "good"),
    card(count("POSSIBLE"), "Yalnızca olası eksik", count("POSSIBLE") ? "warn" : ""),
    card(count("OK"), "Sorunsuz", "good"),
    count("ERROR") ? card(count("ERROR"), "Hata", "bad") : null));
function card(v, k, cls) { return h("div", {class: "card " + (cls || "")}, h("div", {class: "v"}, v), h("div", {class: "k"}, k)); }

const q = h("input", {type: "search", placeholder: "Ara: metot, sınıf…", oninput: apply});
const boxes = {};
const filters = h("div", {class: "toolbar"}, q);
for (const s of Object.keys(STATUS)) {
  if (!count(s)) continue;
  boxes[s] = h("input", {type: "checkbox", checked: true, onchange: apply});
  filters.append(h("label", null, boxes[s], " " + STATUS[s][0] + " (" + count(s) + ")"));
}
const counter = h("span", {class: "muted"});
filters.append(counter);
main.append(filters);

const table = h("table", null, h("tr", null, h("th", null, "#"), h("th", null, "Durum"), h("th", null, "Metot"),
    h("th", null, "Acquire edilen"), h("th", null, "Kesin eksik"), h("th", null, "Olası eksik / belirsiz"),
    h("th", null, "Kullanılmayan"), h("th", null, "Bulgu")));
const rows = D.methods.map(m => {
  const st = STATUS[m.status];
  const src = [m.callsAcquirer ? badge("acquire()", "acc") : null, m.annotated ? badge("@" + (D.annotationShort || "anotasyon"), "acc") : null];
  const row = h("tr", null,
      h("td", {class: "muted"}, m.index),
      h("td", null, badge(st[0], st[1])),
      h("td", null, m.page ? h("a", {class: "mono", href: m.page}, m.method) : h("span", {class: "mono"}, m.method),
          h("div", null, src, m.error ? h("span", {class: "muted"}, " " + m.error) : null)),
      h("td", null, (m.acquired || []).map(c => badge(c, "ok"))),
      h("td", null, (m.missing || []).map(c => badge(c, "hit"))),
      h("td", null, (m.possiblyMissing || []).map(c => badge(c, "warn")), (m.undecided || []).map(c => badge(c + " ?"))),
      h("td", null, (m.unused || []).map(c => badge(c, "warn"))),
      h("td", {class: "num"}, m.findings));
  table.append(row);
  return {row, m, text: (m.method + " " + (m.missing || []).join(" ") + " " + (m.acquired || []).join(" ")).toLowerCase()};
});
main.append(h("div", {class: "panel"}, D.methods.length ? table : h("p", {class: "muted"}, "Acquire eden metot bulunamadı.")));
function apply() {
  const s = q.value.trim().toLowerCase();
  let n = 0;
  for (const r of rows) {
    const visible = (!s || r.text.includes(s)) && (!boxes[r.m.status] || boxes[r.m.status].checked);
    r.row.style.display = visible ? "" : "none";
    if (visible) n++;
  }
  counter.textContent = n + " / " + D.methods.length + " metot";
}
apply();
</script>
</body>
</html>
